name: Build & Analyze with blutter

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Discover target directories
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix=$(python3 scripts/blutter_ci.py discover)" >> "$GITHUB_OUTPUT"

  blutter:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout targets and build scripts
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blutter
      - name: Detect Dart version from target libraries
        id: dart
        run: python3 scripts/blutter_ci.py detect --target "$TARGET" --output-json "out/$TARGET/dart-info.json"
      - name: Build and analyze libapp.so
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/blutter_ci.py analyze --target "$TARGET" 2>&1 | tee "out/$TARGET/blutter.log"
          python3 scripts/test_native_types.py --target "$TARGET" 2>&1 | tee -a "out/$TARGET/blutter.log"
      - name: Upload analysis results and detected Dart metadata
        uses: actions/upload-artifact@v6
        with:
          name: blutter-out-${{ matrix.target }}
          path: out/${{ matrix.target }}/
          if-no-files-found: error
      - name: Upload compiled Dart VM and blutter
        uses: actions/upload-artifact@v6
        with:
          name: blutter-bin-${{ matrix.target }}-dart${{ steps.dart.outputs.dart_version }}
          path: |
            blutter/bin/
            blutter/packages/
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: blutter-debug-${{ matrix.target }}
          path: out/
          if-no-files-found: warn
