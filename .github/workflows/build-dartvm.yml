name: Build blutter dartvm (auto or by version)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'targets/ directory used for automatic Dart version detection'
        required: false
        type: string
      dart_version:
        description: 'auto: detect from target; or supply a Dart version such as 3.14.0'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TARGET: ${{ inputs.target }}
      DART_VERSION: ${{ inputs.dart_version }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blutter
      - name: Detect version and build Dart VM + blutter (without analysis)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/blutter_ci.py build --target "$TARGET" --dart-version "$DART_VERSION" \
            --output-json out/dart-info.json 2>&1 | tee out/blutter.log
      - name: Upload versioned build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: blutter-bin-dart${{ steps.build.outputs.dart_version }}
          path: |
            blutter/bin/
            blutter/packages/
            out/dart-info.json
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: blutter-build-debug
          path: out/
          if-no-files-found: warn
